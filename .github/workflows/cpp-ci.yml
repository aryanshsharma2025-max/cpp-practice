name: C++ Compilation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up GCC
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Verify compilation across active modules
      run: |
        echo "Verifying representative C++ source files across active modules..."
        g++ -std=c++17 -Wall -Wextra 01_Basics/001_hello_world.cpp -o hello
        g++ -std=c++17 -Wall -Wextra 02_If_Else/001_greatest_among_3.cpp -o if_else
        g++ -std=c++17 -Wall -Wextra 10_Pointers/001_add_two_numbers.cpp -o pointer
        g++ -std=c++17 -Wall -Wextra "13_OOP/01_Classes_Objects/001_Student_Class.cpp" -o student_oop
        echo "All representative programs compiled successfully."
